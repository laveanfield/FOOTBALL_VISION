name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies from lockfile
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint (ruff, includes Google-style docstring rules)
        run: uv run ruff check .
      - name: Docstring structure (pydoclint)
        run: uv run pydoclint src tests scripts demo
      - name: Tests with coverage
        run: uv run pytest
