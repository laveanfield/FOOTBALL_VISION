name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install package with dev tools
        run: pip install -e ".[dev]"
      - name: Lint (ruff, includes Google-style docstring rules)
        run: ruff check .
      - name: Docstring structure (pydoclint)
        run: pydoclint src tests scripts demo
      - name: Tests
        run: pytest
