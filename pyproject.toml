[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-vision"
version = "0.1.0"
description = "Computer Vision system for tactical analysis of football video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "opencv-python>=4.8,<5.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dl = ["ultralytics>=8.3"]
tracking = ["supervision>=0.22", "motmetrics>=1.4"]
demo = ["streamlit>=1.30"]
all = [
    "ultralytics>=8.3",
    "supervision>=0.22",
    "motmetrics>=1.4",
    "streamlit>=1.30",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "pydoclint>=0.5",
    "motmetrics>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "pydoclint>=0.5",
    "motmetrics>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=football_vision --cov-branch --cov-report=term-missing --cov-report=html"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/football_vision"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts", "demo"]
# Markdown files (including the plan in docs/) are documentation, not code to reformat.
extend-exclude = ["docs"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["football_vision"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
check-class-attributes = false
native-mode-noqa-location = "definition"
skip-checking-short-docstrings = true
